services:
  db:
    image: postgres:16
    container_name: moodtide-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: moodtide
      POSTGRES_PASSWORD: 12345678
      POSTGRES_DB: moodtide
    ports:
      - "5432:5432"
    volumes:
      - moodtide_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d

volumes:
  moodtide_pgdata: