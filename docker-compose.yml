services:
  db:
    image: postgres:16
    container_name: moodtide-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-moodtide}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the .env file}
      POSTGRES_DB: ${POSTGRES_DB:-moodtide}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - moodtide_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  moodtide_pgdata: